guide.storeys=Épületszintek: a felső „Épületszint” választóval külön szerkesztheted a pincét,\nföldszintet és emeleteket. A „+ Szint” üres szintet hoz létre; nevezd el és add meg\naz abszolút padlóalapszintet méterben (pl. pince −3, földszint 0, emelet +3).\nA falak, helyiségek és bútorok a saját szintjükhöz tartoznak; a tulajdonságokban\nmegadott magasságok ehhez az alapszinthez képest értendők. A 3D az egész épületet mutatja.\nCsak üres szint törölhető; a szintmódosítások is visszavonhatók.\nSzintközi lépcsőhöz az alsó szint mennyezetén ÉS a felső szint padlóján is készíts nyílást.\nSéta közben a lépcső fokain fel- és lefelé haladhatsz; az egymás feletti padlók nem rántanak fel.\n\nLejtős telek: a Projekt / Domboldal és alapozás részen állítható a lejtés,\nirány, terepmagasság és az alapozás (tömbalap vagy terepbe ágyazott pince).\nA Helyiség / Pinceboltozat részen dongaboltozat, csúcsíves, elliptikus vagy\nkeresztboltozat választható. A mennyezetmagasság a vállmagasság; a korona ehhez\naz emelkedést adja hozzá. A felső szint padlóját a boltozat koronája fölé helyezd.\nA rendszer látványtervező, nem végez statikai vagy kivitelezési ellenőrzést.

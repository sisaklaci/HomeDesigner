1.\ Falak\:\ válaszd\ a\ „Fal”\ eszközt,\ kattints\ a\ sarokpontokra.\ Számot\ gépelve\ +\ Enter\ pontos\ hosszt\ ad.\n\ \ \ Az\ első\ pontra\ kattintva\ bezárod\ a\ kört\ –\ ekkor\ a\ helyiség\ is\ létrejön.\n2.\ Szoba\:\ a\ „Szoba”\ eszközzel\ téglalapot\ húzva\ falakkal\ együtt\ hozhatsz\ létre\ helyiséget.\n\ \ \ „Ívelt\ fal\ /\ kör”\:\ 3\ pontos\ ív\ (kezdőpont,\ köztes\ ívpont,\ végpont),\ vagy\n\ \ \ rotunda\ (középpont,\ sugár;\ szám\ +\ Enter\ \=\ pontos\ sugár),\ automatikus\ körpadlóval.\n\ \ \ A\ fal\ középső\ fogantyúja\ hajlít,\ a\ rotunda\ sugárfogantyúja\ a\ teljes\ kört\ méretezi.\n\ \ \ A\ jobb\ oldali\ panelen\ az\ ívszög,\ ívhossz\ és\ sugár\ is\ megadható.\n3.\ Ajtó\ /\ ablak\:\ válaszd\ az\ eszközt,\ majd\ kattints\ egy\ falra.\n\ \ \ Íves\ falban\ is\ elhelyezhető.\ A\ szélesség/távolság\ a\ középíven\ mérendő;\n\ \ \ a\ téglalap\ sík\ kerete\ a\ belső\ ív\ húrjára\ kerül.\ A\ nyílás\ legfeljebb\ 120°-ot\ foglalhat\ el.\n\ \ \ „Felső\ él”\:\ téglalap,\ félkör,\ negyedkör\ bal\ vagy\ jobb\ oldali\ magas\ ponttal.\n\ \ \ A\ magasság\ az\ ív\ csúcsa.\ Félkörnél\ R\ \=\ szélesség/2,\ negyedkörnél\ R\ \=\ szélesség;\n\ \ \ az\ ív\ alatt\ legalább\ 15\ cm\ egyenes\ oldalfal\ kell.\ Az\ íves\ keret\ követi\ az\ íves\ falat.\n4.\ Bútor\:\ a\ bal\ oldali\ katalógusból\ húzd\ be,\ vagy\ „Importálás...”\ (OBJ,\ BLEND,\ MAX,\ FBX...).\n\ \ \ 182\ saját\ modell\ kategóriákba\ rendezve\:\ székek,\ asztalok,\ kanapék,\ fotelek,\n\ \ \ szekrények,\ szaniterek,\ fürdőszobabútorok,\ konyhafelszerelés,\ mosogatók,\n\ \ \ konyhai\ gépek\ és\ ötféle\ hűtőszekrény.\ A\ kategóriaszűrő\ és\ a\ kereső\ együtt\ működik.\n\ \ \ Szórakoztatóelektronika\:\ TV-k,\ hi-fi,\ hangfalak,\ hangprojektor,\ játékkonzol.\n\ \ \ Számítógépek\ és\ tartozékok,\ könyvek/könyvsor/halom,\ radiátorok\ és\ konvektorok,\n\ \ \ valamint\ asztali,\ fali,\ mennyezeti,\ álló\ és\ oszlopventilátor\ is\ elhelyezhető.\n\ \ \ Mennyezeti\ ventilátor\:\ Emelés\ \=\ mennyezetmagasság\ mínusz\ a\ modell\ magassága.\n\ \ \ A\ gépek\ statikus\ látványelemek,\ nincs\ animáció\ vagy\ gépészeti\ méretezés.\n\ \ \ Új\ kategóriák\:\ Ágyak,\ Lámpatestek,\ Előszobabútorok,\ Villamos\ berendezések.\n\ \ \ Lámpatest\ mellé\ a\ felső\ „Lámpa”\ eszközzel\ adj\ tényleges\ fényforrást.\n\ \ \ Villanyóraszekrény,\ inverter\ és\ Wi-Fi\ modul\:\ statikus\ látványmodell,\ nem\ bekötési\ terv.\n\ \ \ TV-antenna\ és\ parabolaantenna\ is\ választható.\ Napelemek\:\ tetőre\ vagy\ talajra\n\ \ \ szerelhető\ panel,\ 0–85°\ között\ állítható\ valódi\ dőlésszöggel\ és\ követő\ tartószerkezettel.\n\ \ \ A\ panel\ szélessége\ és\ hossza\ külön\ állítható;\ tetőre\ az\ Emeléssel\ és\ Forgatással\ illeszd.\n\ \ \ Kerti\ bútorok\ és\ felszerelések\:\ asztalok,\ székek,\ pad,\ napozóágy,\ kanapé,\n\ \ \ szalonnasütő,\ grill,\ kétféle\ hintaágy,\ napernyő,\ virágláda\ és\ piknikasztal.\n\ \ \ Kerti\ növények\:\ lombos/gyümölcs-/nyírfa,\ fenyő,\ oszlopos/gömbtuja,\ bokor,\n\ \ \ virágzó\ cserje,\ sövény,\ rózsa,\ tulipánok,\ virágágyás,\ szőlőtőke\ és\ kordonos\ szőlő.\n\ \ \ Bojlerek\ és\ klímák\:\ gázbojler,\ villanybojler,\ külön\ beltéri\ és\ kültéri\ klíma.\n\ \ \ Medence\ és\ felszerelései\:\ 6×3\ m\ belméretű\ felszíni\ medence,\ kapaszkodókorlát,\n\ \ \ vízforgató\ homokszűrővel.\ A\ korlát\ külön\ elem,\ Emeléssel\ illeszthető\ a\ peremre.\n\ \ \ Kerti\ házak\ és\ tárolók\:\ kerti\ kisház\ és\ szerszámtároló,\ statikus\ zárt\ ajtóval.\n\ \ \ A\ medence\ nem\ vágja\ ki\ automatikusan\ a\ talajt;\ a\ vízfelület\ nem\ animált.\n\ \ \ Szobanövények\:\ fikusz,\ monstera,\ pálma,\ anyósnyelv,\ pozsgás,\ kaktusz,\n\ \ \ orchidea\ és\ muskátli\ cserepben.\ Minden\ növény\ méretezhető\ és\ forgatható.\n\ \ \ A\ falra/pultra\ kerülő\ tárgyak\ „Emelés”\ értékét\ állítsd\ a\ szerelési\ magasságra.\n\ \ \ „+\ Egyedi\ szekrény”\:\ méretek,\ rekeszek,\ polcok,\ fiókok,\ ajtók\ és\ nyitott\ ajtók.\n\ \ \ A\ korpusz,\ frontok\ és\ fogantyúk\ anyaga\ külön\ állítható.\ Ez\ látványterv,\ nem\ szabásjegyzék.\n\ \ \ Ajtók\:\ kétoldali\ kilincs;\ „Ajtólap\ üvegbetét\ →\ Részleges\ üvegezés”.\n\ \ \ A\ betét\ bal/alsó\ széle,\ szélessége\ és\ magassága\ centiméterben\ állítható.\n\ \ \ Az\ ív\ alatt\ és\ a\ széleken\ legalább\ 8\ cm\ tömör\ szegély\ maradjon.\n5.\ Kijelölés\:\ kattints\ bármire\ –\ jobb\ oldalt\ szerkesztheted\ a\ méretet,\ burkolatot,\ színt.\n\ \ \ Bútor\ sarkait\ húzva\ átméretezhető,\ a\ kék\ gombbal\ forgatható\ (Shift\:\ arányos).\n\ \ \ Helyiség\ →\ „Padlószint\ (abszolút)”\:\ például\ −51\ cm\ \=\ három\ 17\ cm-es\ fellépés.\n\ \ \ „Padlószint”\ eszköz\ vagy\ „+\ Padlószint-terület”\:\ rajzolj\ belső\ téglalapot.\n\ \ \ A\ területnél\ 300×300\ cm\ és\ −34\ cm\:\ 3×3\ m-es,\ két\ fellépéssel\ süllyesztett\ rész.\n\ \ \ A\ terület\ alakja\ téglalap,\ kör\ vagy\ ovális;\ a\ szinteltérés\ a\ szobához\ viszonyított.\n\ \ \ „Lépcső\ létrehozása”\:\ oldal,\ fokszám,\ szélesség\ és\ belépés\ után\ külön\ lépcső\ készül.\n\ \ \ A\ szintterületek\ maradjanak\ a\ szobán\ belül,\ ne\ fedjék\ egymást.\n\ \ \ A\ mennyezet,\ falak,\ ajtók\ és\ meglévő\ bútorok\ nem\ mozdulnak\ a\ padlóval.\n\ \ \ Új\ bútor\ a\ helyi\ padlóra\ kerül;\ meglévőnél\ „Helyi\ padlóra\ helyezés”.\n\ \ \ A\ séta\ követi\ a\ padlószintet\ és\ az\ egyenes\ lépcsőfokokat,\ nincs\ ütközésvizsgálat.\n6.\ Tető\ /\ erkély\:\ a\ lenyíló\ menüből\ tető,\ tetősíkablak,\ kiugró\ tetőablak,\n\ \ \ süllyesztett\ tetőterasz\ vagy\ korlátos\ erkély\ adható\ hozzá.\n\ \ \ Több\ épületnél\ előbb\ jelöld\ ki\ a\ kívánt\ épület\ egyik\ falát\ vagy\ helyiségét\!\n\ \ \ Az\ új\ tető\ követi\ a\ zárt\ külső\ falakat,\ az\ íveket\ is.\ Rotundára\ kúptető\ készül;\n\ \ \ a\ jobb\ oldalon\ kupolatetőre\ is\ válthatsz.\ A\ kör\ alap\ sugara\ külön\ méretezhető.\n\ \ \ Falváltoztatás\ után\:\ „Falakhoz\ igazítás”\ az\ adott\ tetőn.\n\ \ \ Kúpra/kupolára\ jelenleg\ nem\ helyezhető\ tetőablak\ vagy\ tetőterasz.\n\ \ \ Tetőelemek\:\ válaszd\ ki\ a\ tetőt,\ majd\ a\ típust.\ Az\ alaprajzon\ húzhatók,\n\ \ \ a\ jobb\ oldalon\ méretezhetők.\ Az\ X/Y\ helyük\ a\ tető\ sarkától\ mért\ távolság.\n7.\ 3D\:\ bal\ egér\ forgatás,\ jobb\ egér\ mozgatás,\ görgő\ nagyítás,\ „Séta”\ mód\ W/A/S/D.\n\ \ \ „REC”\:\ válassz\ MP4\ fájlt,\ majd\ járd\ be\ a\ tervet.\ „Stop”\:\ felvétel\ lezárása\ és\ mentése.\n\ \ \ Hang\ nélküli,\ 15\ kép/mp-es,\ legfeljebb\ 960×540-es\ valós\ idejű\ 3D\ videó,\n\ \ \ nem\ fotórealisztikus\ képkockák\ renderelése.\ Nincs\ külön\ telepítendő\ videókódoló.\n\ \ \ Az\ időszámláló\ jelzi\ a\ felvételt;\ kilépés\ előtt\ várd\ meg\ a\ „Mentve”\ jelzést.\n\ \ \ A\ „Mennyezet”\ induláskor\ látható,\ séta\ után\ is\ megmarad\ a\ beállítása.\n\ \ \ A\ helyiség\ jobb\ paneljén\ a\ „Van\ mennyezet”\ is\ legyen\ bekapcsolva.\n\ \ \ A\ Projekt\ panel\ „Helyiségek\ és\ mennyezet”\ listájából\ a\ „Helyiség\ megnyitása”\n\ \ \ gombbal\ is\ elérheted,\ alaprajzi\ kijelölés\ nélkül.\ Ha\ nincs\ helyiségfelület,\n\ \ \ a\ jelzett\ Padló\ eszközzel\ rajzold\ körbe\ a\ területet,\ majd\ engedélyezd\ a\ mennyezetét.\n\ \ \ A\ külön\ rajzolt\ padló\ nem\ kap\ automatikusan\ mennyezetet.\n8.\ „Fotó\ render”\:\ fotórealisztikus\ kép\ a\ 3D\ nézet\ kameraállásából.\n9.\ „Lépcső”\ menü\ (a\ katalógus\ alján\ is)\:\ egyenes\ vagy\ csigalépcső.\n\ \ \ Jobb\ oldalon\ szintmagasság,\ fokszám,\ járólapvastagság,\ méretek\ és\ korlát;\n\ \ \ csigánál\ fordulatszög,\ belső\ sugár\ és\ forgásirány\ is.\ Az\ „Alsó\ járószint”\n\ \ \ az\ induló\ padlómagasság;\ a\ szintmagasság\ nem\ tartalmazza\ a\ korlátot.\n\ \ \ A\ lépcső\ jobb\ paneljén\ a\ „Födémnyílás\ a\ lépcső\ fölé”\ gombok\ készítenek\n\ \ \ szerkeszthető\ mennyezetnyílást.\ A\ nyílás\ nem\ követi\ később\ a\ lépcsőt.\n10.\ „Födémnyílás”\:\ téglalap/ovális\ húzással,\ kör\ középpont\ +\ sugár,\n\ \ \ szabad\ sokszög\ pontonként\ (Enter/dupla\ kattintás\ \=\ lezárás).\n\ \ \ A\ helyiséget\ előbb\ jelöld\ ki,\ ha\ több\ felület\ fedi\ egymást.\n\ \ \ A\ jobb\ panelen\ külön\ kapcsolható\ a\ mennyezet-\ és\ padlókivágás.\n\ \ \ A\ nyílás\ helyiséghatáron\ túli\ része\ nem\ vág\ másik\ helyiséget.\n\ \ \ A\ nyílás\ ellenőrzéséhez\ a\ 3D\ „Mennyezet”\ kapcsolója\ legyen\ bekapcsolva.\n\ \ \ Nincs\ automatikus\ emeletépítés\ vagy\ statikai/kivitelezési\ méretezés.\n11.\ Nyelv\:\ a\ Magyar\ /\ English\ zászlókkal\ azonnal\ válthatsz,\ újraindítás\ nélkül.\n\ \ \ A\ nyelvet\ megjegyezzük.\ A\ terv,\ kijelölés,\ kamera,\ fájlnév\ és\ visszavonási\ előzmények\n\ \ \ megmaradnak;\ semmit\ nem\ mentünk\ vagy\ dobunk\ el.\ Videófelvétel\ közben\ előbb\ nyomd\ meg\n\ \ \ a\ Stop\ gombot,\ és\ várd\ meg\ a\ mentés\ befejezését.\n\nBillentyűk\:\ Del\ törlés,\ R\ forgatás,\ nyilak\ mozgatás,\ Ctrl+Z\ /\ Ctrl+Y,\ Ctrl+D\ másolat,\ Esc\ kilépés\ az\ eszközből.=1.\ Walls\:\ choose\ “Wall”\ and\ click\ the\ corners.\ Type\ a\ number\ +\ Enter\ for\ an\ exact\ length.\n\ \ \ Click\ the\ first\ point\ to\ close\ the\ outline\ and\ create\ a\ room.\n2.\ Room\:\ drag\ a\ rectangle\ with\ the\ “Room”\ tool\ to\ create\ a\ room\ with\ walls.\n\ \ \ “Curved\ wall\ /\ circle”\:\ a\ three-point\ arc\ (start,\ intermediate\ arc\ point,\ end),\ or\n\ \ \ a\ rotunda\ (center,\ radius;\ number\ +\ Enter\ for\ an\ exact\ radius)\ with\ an\ automatic\ circular\ floor.\n\ \ \ Drag\ the\ wall\ middle\ handle\ to\ bend\ it;\ the\ rotunda\ radius\ handle\ resizes\ the\ entire\ circle.\n\ \ \ The\ right\ panel\ also\ accepts\ arc\ angle,\ arc\ length\ and\ radius.\n3.\ Door\ /\ window\:\ choose\ the\ tool,\ then\ click\ a\ wall.\n\ \ \ Openings\ can\ also\ be\ placed\ in\ curved\ walls.\ Width/distance\ are\ measured\ along\ the\ center\ arc;\n\ \ \ the\ flat\ rectangular\ frame\ is\ placed\ on\ the\ inner\ arc\ chord.\ An\ opening\ may\ span\ at\ most\ 120°.\n\ \ \ “Top\ edge”\:\ rectangle,\ semicircle,\ or\ quarter\ circle\ with\ its\ high\ point\ on\ the\ left\ or\ right.\n\ \ \ Height\ is\ the\ arch\ apex.\ For\ a\ semicircle\ R\ \=\ width/2;\ for\ a\ quarter\ circle\ R\ \=\ width;\n\ \ \ leave\ at\ least\ 15\ cm\ of\ straight\ jamb\ below\ the\ arch.\ The\ curved\ frame\ follows\ the\ curved\ wall.\n4.\ Furniture\:\ drag\ from\ the\ catalog\ on\ the\ left,\ or\ use\ “Import...”\ (OBJ,\ BLEND,\ MAX,\ FBX...).\n\ \ \ 182\ original\ models\ are\ organized\ into\ categories\:\ chairs,\ tables,\ sofas,\ armchairs,\n\ \ \ cabinets,\ sanitary\ ware,\ bathroom\ furniture,\ kitchen\ equipment,\ sinks,\n\ \ \ kitchen\ appliances\ and\ five\ refrigerator\ types.\ Category\ and\ search\ filters\ work\ together.\n\ \ \ Home\ entertainment\:\ TVs,\ hi-fi,\ speakers,\ soundbar\ and\ game\ console.\n\ \ \ Computers\ and\ accessories,\ books/rows/stacks,\ radiators\ and\ convectors,\n\ \ \ plus\ desk,\ wall,\ ceiling,\ pedestal\ and\ tower\ fans\ can\ also\ be\ placed.\n\ \ \ Ceiling\ fan\:\ Elevation\ \=\ ceiling\ height\ minus\ the\ model\ height.\n\ \ \ Appliances\ are\ static\ visual\ assets\ without\ animation\ or\ engineering\ calculations.\n\ \ \ Further\ categories\:\ Beds,\ Light\ fittings,\ Hallway\ furniture\ and\ Electrical\ equipment.\n\ \ \ Add\ an\ actual\ light\ source\ beside\ a\ light\ fitting\ using\ the\ top\ “Light”\ tool.\n\ \ \ Electric\ meter\ cabinets,\ inverters\ and\ Wi-Fi\ modules\ are\ static\ visual\ models,\ not\ wiring\ plans.\n\ \ \ TV\ antennas\ and\ satellite\ dishes\ are\ also\ available.\ Solar\ panels\:\ roof-mounted\ or\ ground-mounted\n\ \ \ panels\ with\ a\ true\ adjustable\ tilt\ of\ 0–85°\ and\ automatically\ adapting\ supports.\n\ \ \ Adjust\ panel\ width\ and\ length\ separately;\ use\ Elevation\ and\ Rotation\ to\ fit\ a\ panel\ to\ a\ roof.\n\ \ \ Garden\ furniture\ and\ equipment\:\ tables,\ chairs,\ bench,\ sun\ lounger,\ sofa,\n\ \ \ outdoor\ fire\ pit,\ barbecue,\ two\ garden\ swings,\ parasol,\ planter\ and\ picnic\ table.\n\ \ \ Garden\ plants\:\ deciduous/fruit/birch\ trees,\ fir,\ columnar/globe\ arborvitae,\ bush,\n\ \ \ flowering\ shrub,\ hedge,\ roses,\ tulips,\ flower\ bed,\ grapevine\ and\ trellised\ grapevine.\n\ \ \ Water\ heaters\ and\ air\ conditioners\:\ gas/electric\ water\ heaters\ and\ separate\ indoor/outdoor\ units.\n\ \ \ Pool\ and\ equipment\:\ above-ground\ pool\ with\ 6×3\ m\ interior,\ handrail,\n\ \ \ pump\ with\ sand\ filter.\ The\ handrail\ is\ separate;\ use\ Elevation\ to\ fit\ it\ to\ the\ rim.\n\ \ \ Garden\ buildings\ and\ storage\:\ garden\ shed\ and\ tool\ storage\ shed,\ with\ static\ closed\ doors.\n\ \ \ The\ pool\ does\ not\ automatically\ cut\ the\ ground;\ the\ water\ surface\ is\ not\ animated.\n\ \ \ Indoor\ plants\:\ potted\ ficus,\ monstera,\ palm,\ snake\ plant,\ succulent,\ cactus,\n\ \ \ orchid\ and\ geranium.\ Every\ plant\ can\ be\ resized\ and\ rotated.\n\ \ \ Set\ “Elevation”\ to\ the\ mounting\ height\ for\ objects\ placed\ on\ walls\ or\ worktops.\n\ \ \ “+\ Custom\ cabinet”\:\ dimensions,\ compartments,\ shelves,\ drawers,\ doors\ and\ open\ doors.\n\ \ \ Carcass,\ fronts\ and\ handles\ have\ separate\ materials.\ This\ is\ a\ visualization,\ not\ a\ cutting\ list.\n\ \ \ Doors\ have\ handles\ on\ both\ sides;\ use\ “Door-leaf\ glass\ panel\ →\ Partial\ glazing”.\n\ \ \ Set\ the\ panel\ left/bottom\ edge,\ width\ and\ height\ in\ centimetres.\n\ \ \ Leave\ at\ least\ an\ 8\ cm\ solid\ border\ below\ the\ arch\ and\ along\ the\ edges.\n5.\ Selection\:\ click\ any\ item\ to\ edit\ its\ dimensions,\ finishes\ and\ color\ on\ the\ right.\n\ \ \ Drag\ furniture\ corners\ to\ resize,\ or\ use\ the\ blue\ knob\ to\ rotate\ (Shift\:\ proportional).\n\ \ \ Room\ →\ “Floor\ elevation\ (absolute)”\:\ for\ example\ −51\ cm\ \=\ three\ 17\ cm\ risers.\n\ \ \ Use\ the\ “Floor\ elevation”\ tool\ or\ “+\ Floor-level\ area”\ to\ draw\ an\ interior\ rectangle.\n\ \ \ An\ area\ of\ 300×300\ cm\ at\ −34\ cm\ creates\ a\ 3×3\ m\ sunken\ area\ with\ two\ risers.\n\ \ \ The\ area\ can\ be\ rectangular,\ circular\ or\ elliptical;\ its\ elevation\ offset\ is\ relative\ to\ the\ room.\n\ \ \ “Create\ stairs”\:\ choose\ a\ side,\ step\ count,\ width\ and\ tread\ depth\ to\ create\ separate\ stairs.\n\ \ \ Keep\ floor-level\ areas\ within\ the\ room\ and\ do\ not\ overlap\ them.\n\ \ \ Ceilings,\ walls,\ doors\ and\ existing\ furniture\ do\ not\ move\ with\ the\ floor.\n\ \ \ New\ furniture\ uses\ the\ local\ floor;\ for\ existing\ items\ use\ “Place\ on\ local\ floor”.\n\ \ \ Walk\ mode\ follows\ floor\ levels\ and\ straight\ stair\ treads;\ there\ is\ no\ collision\ detection.\n6.\ Roof\ /\ balcony\:\ the\ dropdown\ adds\ roofs,\ skylights,\ dormers,\n\ \ \ recessed\ roof\ terraces\ or\ balconies\ with\ railings.\n\ \ \ With\ several\ buildings,\ first\ select\ a\ wall\ or\ room\ of\ the\ desired\ building.\n\ \ \ A\ new\ roof\ follows\ closed\ exterior\ walls,\ including\ curves.\ A\ rotunda\ gets\ a\ conical\ roof;\n\ \ \ switch\ to\ a\ dome\ on\ the\ right.\ The\ circular\ footprint\ radius\ can\ be\ resized\ separately.\n\ \ \ After\ wall\ edits\ use\ “Fit\ to\ walls”\ on\ the\ relevant\ roof.\n\ \ \ Skylights\ and\ roof\ terraces\ cannot\ currently\ be\ placed\ on\ conical\ or\ dome\ roofs.\n\ \ \ Roof\ elements\:\ select\ the\ roof,\ then\ the\ element\ type.\ Drag\ them\ on\ the\ plan;\n\ \ \ edit\ dimensions\ on\ the\ right.\ X/Y\ positions\ are\ measured\ from\ the\ roof\ corner.\n7.\ 3D\:\ left\ mouse\ orbits,\ right\ mouse\ pans,\ the\ wheel\ zooms;\ “Walk”\ uses\ W/A/S/D.\n\ \ \ “REC”\:\ choose\ an\ MP4\ file\ and\ walk\ through\ the\ project.\ “Stop”\ finalizes\ and\ saves\ the\ recording.\n\ \ \ Silent\ real-time\ 3D\ video\ at\ 15\ fps\ and\ at\ most\ 960×540;\n\ \ \ this\ does\ not\ render\ photorealistic\ frames.\ No\ separately\ installed\ video\ codec\ is\ required.\n\ \ \ The\ timer\ indicates\ recording;\ wait\ for\ “Saved”\ before\ closing.\n\ \ \ “Ceiling”\ is\ visible\ at\ startup\ and\ its\ setting\ is\ retained\ after\ walking.\n\ \ \ Also\ enable\ “Has\ ceiling”\ on\ the\ room's\ right\ panel.\n\ \ \ The\ Project\ panel's\ “Rooms\ and\ ceiling”\ list\ and\ “Open\ room”\ button\n\ \ \ provide\ access\ without\ selecting\ on\ the\ plan.\ If\ there\ is\ no\ room\ surface,\n\ \ \ outline\ the\ area\ with\ the\ indicated\ Floor\ tool,\ then\ enable\ its\ ceiling.\n\ \ \ A\ separately\ drawn\ floor\ does\ not\ automatically\ get\ a\ ceiling.\n8.\ “Photo\ render”\:\ a\ photorealistic\ image\ from\ the\ 3D\ camera\ position.\n9.\ “Stairs”\ menu\ (also\ at\ the\ bottom\ of\ the\ catalog)\:\ straight\ or\ spiral\ stairs.\n\ \ \ On\ the\ right\:\ rise,\ step\ count,\ tread\ thickness,\ dimensions\ and\ railing;\n\ \ \ spiral\ stairs\ also\ offer\ total\ turn,\ inner\ radius\ and\ ascending\ direction.\ “Lower\ walking\ level”\n\ \ \ is\ the\ starting\ floor\ elevation;\ rise\ does\ not\ include\ the\ railing.\n\ \ \ The\ stair\ panel's\ “Slab\ opening\ above\ stairs”\ buttons\ create\n\ \ \ editable\ ceiling\ openings.\ Openings\ do\ not\ follow\ later\ stair\ edits.\n10.\ “Slab\ opening”\:\ drag\ a\ rectangle/ellipse,\ use\ center\ +\ radius\ for\ a\ circle,\n\ \ \ or\ click\ free-polygon\ vertices\ (Enter/double-click\ to\ close).\n\ \ \ Select\ the\ room\ first\ if\ several\ surfaces\ overlap.\n\ \ \ Toggle\ ceiling\ and\ floor\ cuts\ independently\ on\ the\ right.\n\ \ \ The\ part\ of\ an\ opening\ outside\ its\ room\ does\ not\ cut\ other\ rooms.\n\ \ \ Enable\ “Ceiling”\ in\ 3D\ to\ inspect\ the\ opening.\n\ \ \ No\ automatic\ multi-story\ construction\ or\ structural/engineering\ calculations.\n11.\ Language\:\ the\ Magyar\ /\ English\ flags\ switch\ immediately\ without\ restarting.\n\ \ \ Your\ choice\ is\ remembered.\ The\ project,\ selection,\ camera,\ filename\ and\ undo\ history\n\ \ \ remain\ intact;\ nothing\ is\ saved\ or\ discarded.\ During\ video\ recording,\ first\ press\n\ \ \ Stop\ and\ wait\ until\ saving\ finishes.\n\nKeys\:\ Del\ delete,\ R\ rotate,\ arrows\ move,\ Ctrl+Z\ /\ Ctrl+Y,\ Ctrl+D\ duplicate,\ Esc\ leave\ the\ tool.

A\ „Támfal\ a\ feltöltés\ köré”\ függőleges\ peremre\ állítja\ a\ feltöltést,\ és\ a\ körvonal\ külső\ oldalán\ önálló,\ szerkeszthető\ támfalakat\ hoz\ létre\ az\ aktív\ szinten\ (koronájuk\ a\ feltöltés\ szintje,\ aljuk\ a\ terepet\ követi).\ Egy\ lépésben\ visszavonható;\ később\ nem\ követi\ a\ feltöltés\ módosítását.=“Retaining wall around the fill” gives the fill a vertical edge and creates independent, editable retaining walls on the outside of its outline on the active storey (their top is the fill level, their bottom follows the terrain). It can be undone in one step and does not follow later changes to the fill.

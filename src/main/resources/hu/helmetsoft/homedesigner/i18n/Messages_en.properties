A\ mennyezet\ magassága\ a\ boltozat\ vállvonala;\ a\ csúcs\ az\ emelkedéssel\ magasabb.\ A\ födémnyílások\ a\ boltozatot\ is\ kivágják.\ A\ fölötte\ levő\ szintet\ a\ csúcs\ fölé\ helyezd.=Ceiling height is the vault spring line; the crown is higher by the rise. Slab openings also cut the vault. Position the next storey above the crown.

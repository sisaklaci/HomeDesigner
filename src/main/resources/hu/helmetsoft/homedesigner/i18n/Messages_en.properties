A\ terep\ lejt,\ az\ épületszintek\ vízszintesek\ maradnak.\ 0°\ irány\ az\ alaprajzi\ észak.\ Az\ alaptest\ a\ helyiségpadlók\ körvonalát\ követi;\ pince\ módban\ a\ talaj\ a\ helyiségek\ területén\ kivágódik.=The terrain slopes while building floors stay horizontal. Direction 0 degrees is plan north. Foundations follow room floor outlines; cellar mode excavates the terrain inside rooms.


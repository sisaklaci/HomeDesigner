guide.storeys=Storeys: use the top Storey selector to edit the basement, ground floor and upper\nfloors separately. + Storey creates an empty storey; name it and enter its absolute\nfloor datum in metres (for example basement −3, ground 0, upper floor +3).\nWalls, rooms and furniture belong to their own storey; property-panel heights are\nrelative to that storey's datum. 3D shows the entire building.\nOnly empty storeys can be deleted; storey changes can also be undone.\nFor stairs between storeys, cut BOTH the lower room's ceiling AND the upper room's floor.\nWalk up and down stair treads; overlapping floors will not pull you onto another storey.\n\nSloping site: Project / Hillside and foundation controls the slope, direction,\nterrain datum and foundation (block foundation or embedded cellar).\nRoom / Cellar vault offers barrel, pointed, elliptical and cross vaults.\nCeiling height is the spring line; the crown adds the vault rise to that height.\nPlace the upper-storey floor above the vault crown.\nThis is a visual design tool, not a structural or construction verification system.
